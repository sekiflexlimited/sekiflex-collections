<!-- Paste inside <head> or your <style> section in shop.html -->
<style>
  /* Compact 2-column catalog boxes */
  #catalog-grid,
  .catalog-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }

  .catalog-card,
  .product-card {
    padding: 8px !important;
    border-radius: 10px !important;
  }

  .catalog-card img,
  .product-card img {
    width: 100% !important;
    height: 165px !important;
    object-fit: cover !important;
    border-radius: 8px !important;
    display: block !important;
  }

  /* Compact announcement and promo banner images */
  .announcement-banner,
  .announcement-box,
  .promo-card,
  .announcement-wrapper {
    max-height: 135px !important;
    overflow: hidden !important;
  }

  .announcement-banner img,
  .announcement-box img,
  .promo-card img,
  .announcement-img,
  .promo-card-img {
    width: 100% !important;
    max-height: 115px !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* Ensure category images are clickable */
  [data-category],
  [data-category] img {
    cursor: pointer;
  }

  @media (min-width: 768px) {
    .catalog-card img,
    .product-card img {
      height: 215px !important;
    }

    .announcement-banner img,
    .announcement-box img,
    .promo-card img,
    .announcement-img,
    .promo-card-img {
      max-height: 155px !important;
    }
  }
</style>

<!-- Paste right before </body> in shop.html -->
<script>
  document.addEventListener('click', (event) => {
    const categoryEl = event.target.closest('[data-category]');
    if (!categoryEl) return;

    const category = categoryEl.getAttribute('data-category');
    if (!category) return;

    if (typeof applyCategoryFilter === 'function') {
      applyCategoryFilter(category);
    } else if (typeof filterByCategory === 'function') {
      filterByCategory(category);
    } else if (typeof renderCatalog === 'function') {
      renderCatalog(category);
    }

    const targetSection =
      document.querySelector('#catalog-section') ||
      document.querySelector('#catalog-grid') ||
      document.querySelector('.catalog-grid');

    if (targetSection) {
      targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
</script>
