<!-- Paste right before </body> in shop.html (replaces earlier test snippet) -->
<style id="sekiflex-layout-fix">
  /* Force compact catalog & announcement/promo images even if inline styles exist */
  #catalog-grid img,
  .catalog-grid img,
  #products-grid img,
  .products-grid img,
  .catalog-card img,
  .product-card img {
    width: 100% !important;
    max-width: 100% !important;
    height: 150px !important;
    max-height: 150px !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* Compact 2-column grid for catalog boxes */
  #catalog-grid,
  .catalog-grid,
  #products-grid,
  .products-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }

  /* Compact the 4 announcement / promo boxes & their images */
  .announcement-banner img,
  .announcement-box img,
  .announcement-card img,
  .announcement-item img,
  .announcement-img,
  .promo-card img,
  .promo-box img,
  .promo-grid img,
  .announcements-grid img,
  [class*="announcement"] img,
  [class*="promo"] img {
    width: 100% !important;
    max-width: 100% !important;
    height: 105px !important;
    max-height: 105px !important;
    object-fit: cover !important;
    display: block !important;
  }

  .announcement-banner,
  .announcement-box,
  .announcement-card,
  .announcement-item,
  .promo-card,
  .promo-box,
  [class*="announcement"],
  [class*="promo"] {
    max-height: 140px !important;
    overflow: hidden !important;
  }

  /* Catch any other large standalone images on the page */
  main img,
  section img,
  .container img {
    max-height: 220px !important;
  }

  [data-category] {
    cursor: pointer !important;
  }

  @media (min-width: 768px) {
    #catalog-grid img,
    .catalog-grid img,
    #products-grid img,
    .products-grid img,
    .catalog-card img,
    .product-card img {
      height: 200px !important;
      max-height: 200px !important;
    }

    [class*="announcement"] img,
    [class*="promo"] img {
      height: 130px !important;
      max-height: 130px !important;
    }
  }
</style>

<script>
  (function () {
    // Remove HTML width/height attributes on images that force oversized rendering
    document.querySelectorAll('img').forEach((img) => {
      img.removeAttribute('width');
      img.removeAttribute('height');
    });

    // Capture-phase listener so category clicks run first and jump to catalog photos
    document.addEventListener(
      'click',
      (event) => {
        const trigger = event.target.closest(
          '[data-category], .category-card, .category-item, [class*="category"]'
        );
        if (!trigger) return;

        // Ignore clicks inside the catalog/product list itself so product cards aren't treated as categories
        if (trigger.closest('#catalog-grid, .catalog-grid, #products-grid, .products-grid')) {
          return;
        }

        const rawCategory =
          trigger.getAttribute('data-category') ||
          trigger.dataset.category ||
          trigger.querySelector('[data-category]')?.getAttribute('data-category') ||
          trigger.textContent?.trim();

        if (!rawCategory) return;

        const cleanCategory = rawCategory.split('\n')[0].trim();

        const filterFns = [
          window.applyCategoryFilter,
          window.filterByCategory,
          window.selectCategory,
          window.filterProducts,
          window.renderCatalog
        ];

        for (const fn of filterFns) {
          if (typeof fn === 'function') {
            try {
              fn(cleanCategory);
            } catch (e) {}
          }
        }

        // Also click matching category filter buttons/tabs if the page uses them
        document.querySelectorAll('button, a, [role="button"]').forEach((el) => {
          if (el === trigger) return;
          const label = el.textContent?.trim();
          if (label && label.toLowerCase() === cleanCategory.toLowerCase()) {
            el.click();
          }
        });

        const catalogTarget =
          document.querySelector('#catalog-section') ||
          document.querySelector('#catalog') ||
          document.querySelector('#catalog-grid') ||
          document.querySelector('.catalog-grid') ||
          document.querySelector('#products-grid') ||
          document.querySelector('.products-grid');

        if (catalogTarget) {
          event.preventDefault();
          catalogTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      },
      true
    );
  })();
</script>
