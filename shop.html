  <style id="sekiflex-storefront-fix">
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Compact 2-column catalog grid & cards */
    #catalog-grid,
    .catalog-grid,
    #products-grid,
    .products-grid,
    #shop-grid,
    .shop-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 10px !important;
      padding: 10px !important;
    }

    .catalog-card,
    .product-card,
    .shop-card {
      padding: 8px !important;
      border-radius: 10px !important;
      overflow: hidden !important;
    }

    #catalog-grid img,
    .catalog-grid img,
    #products-grid img,
    .products-grid img,
    #shop-grid img,
    .shop-grid img,
    .catalog-card img,
    .product-card img,
    .shop-card img {
      width: 100% !important;
      max-width: 100% !important;
      height: 155px !important;
      max-height: 155px !important;
      object-fit: contain !important;
      display: block !important;
      margin: 0 auto !important;
    }

    /* Compact announcement & wall promo boxes + lock against customer editing */
    [class*="announcement"],
    [class*="promo"],
    [class*="wall"],
    [id*="announcement"],
    [id*="promo"],
    [id*="wall"] {
      max-height: 145px !important;
      overflow: hidden !important;
      -webkit-user-modify: read-only !important;
      user-select: none !important;
      caret-color: transparent !important;
    }

    [class*="announcement"] *,
    [class*="promo"] *,
    [class*="wall"] *,
    [id*="announcement"] *,
    [id*="promo"] *,
    [id*="wall"] * {
      -webkit-user-modify: read-only !important;
      user-select: none !important;
      caret-color: transparent !important;
    }

    [class*="announcement"] img,
    [class*="promo"] img,
    [class*="wall"] img,
    [id*="announcement"] img,
    [id*="promo"] img,
    [id*="wall"] img {
      width: 100% !important;
      max-width: 100% !important;
      height: 105px !important;
      max-height: 105px !important;
      object-fit: contain !important;
      display: block !important;
      margin: 0 auto !important;
    }

    /* Keep other section images from stretching huge */
    main img,
    section img {
      max-height: 210px !important;
    }

    /* Clickable category tiles */
    [data-category],
    .category-card,
    .category-item,
    [class*="category"] {
      cursor: pointer !important;
    }

    @media (min-width: 768px) {
      #catalog-grid img,
      .catalog-grid img,
      #products-grid img,
      .products-grid img,
      #shop-grid img,
      .shop-grid img,
      .catalog-card img,
      .product-card img,
      .shop-card img {
        height: 210px !important;
        max-height: 210px !important;
      }

      [class*="announcement"] img,
      [class*="promo"] img,
      [class*="wall"] img,
      [id*="announcement"] img,
      [id*="promo"] img,
      [id*="wall"] img {
        height: 130px !important;
        max-height: 130px !important;
      }
    }
  </style>

      const backdrop = document.getElementById("sekiflex-info-modal-backdrop");
      const modalTitle = document.getElementById("sekiflex-info-modal-title");
      const modalBody = document.getElementById("sekiflex-info-modal-body");
      const closeBtn = document.getElementById("sekiflex-info-modal-close");

      function openInfoSection(key) {
        const section = INFO_SECTIONS[key];
        if (!section || !backdrop || !modalTitle || !modalBody) return;
        modalTitle.textContent = section.title;
        modalBody.innerHTML = section.html;
        modalBody.scrollTop = 0;
        backdrop.classList.add("is-open");
      }

      function closeInfoSection() {
        if (backdrop) {
          backdrop.classList.remove("is-open");
        }
      }

      if (closeBtn) {
        closeBtn.addEventListener("click", closeInfoSection);
      }

      if (backdrop) {
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeInfoSection();
        });
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeInfoSection();
      });

      function detectInfoKey(text) {
        const clean = text.toLowerCase().replace(/\s+/g, " ").trim();
        if (clean.includes("about sekiflex") || clean === "about") return "about";
        if (clean.includes("delivery") || clean.includes("uyo store pickup") || clean.includes("shipping")) return "delivery";
        if (clean.includes("help & customer support") || clean.includes("customer support")) return "support";
        if (clean.includes("orders & live tracking") || clean.includes("live tracking")) return "orders";
        if (clean.includes("inbox & promo") || clean.includes("promotional alerts")) return "inbox";
        if (clean.includes("ratings & reviews")) return "reviews";
        if (clean.includes("privacy policy")) return "privacy";
        if (clean.includes("refund, returns") || clean.includes("refund & returns")) return "refunds";
        if (clean.includes("terms & conditions")) return "terms";
        return null;
      }

      function removeSocialFromAccountSettings() {
        const appRoot = document.getElementById("app");
        if (!appRoot) return;

        const candidates = appRoot.querySelectorAll("a, button, li, div[role='button'], span");
        candidates.forEach((el) => {
          if (el.closest("#sekiflex-info-modal") || el.closest("#sekiflex-info-bar")) return;
          const label = (el.textContent || "").toLowerCase().trim();
          const href = (el.getAttribute("href") || "").toLowerCase();
          const isSocial =
            label === "facebook" ||
            label === "tiktok" ||
            href.includes("facebook.com") ||
            href.includes("tiktok.com");

          if (isSocial) {
            const row = el.closest("li, a, button, .menu-item, .settings-item, .account-item") || el;
            if (row && row.parentNode && row !== appRoot) {
              row.style.setProperty("display", "none", "important");
            }
          }
        });
      }

      function cleanStorefrontDom() {
        document.querySelectorAll("img").forEach((img) => {
          img.removeAttribute("width");
          img.removeAttribute("height");
        });

        removeSocialFromAccountSettings();

        const promoContainers = document.querySelectorAll(
          '[class*="announcement"], [class*="promo"], [class*="wall"], [id*="announcement"], [id*="promo"], [id*="wall"]'
        );

        promoContainers.forEach((box) => {
          if (box.closest("#sekiflex-info-bar")) return;
          if (box.hasAttribute("contenteditable")) {
            box.setAttribute("contenteditable", "false");
          }
          box.querySelectorAll("[contenteditable]").forEach((el) => {
            el.setAttribute("contenteditable", "false");
          });

          const img = box.querySelector("img");
          if (img && img.getAttribute("src") && img.getAttribute("src").trim() !== "") {
            box.querySelectorAll("span, div, p, strong, small").forEach((node) => {
              if (node.children.length === 0 && node.textContent && node.textContent.trim() === "SC") {
                node.style.setProperty("display", "none", "important");
              }
            });
          }
        });
      }

      document.addEventListener(
        "beforeinput",
        (event) => {
          if (
            event.target &&
            event.target.closest &&
            event.target.closest(
              '[class*="announcement"], [class*="promo"], [class*="wall"], [id*="announcement"], [id*="promo"], [id*="wall"]'
            )
          ) {
            event.preventDefault();
          }
        },
        true
      );

      document.addEventListener(
        "click",
        (event) => {
          if (event.target && event.target.closest && event.target.closest("#sekiflex-info-modal")) {
            return;
          }

          const infoTarget = event.target.closest("[data-info-section], a, button, li, div[role='button']");
          if (infoTarget) {
            const explicitKey = infoTarget.getAttribute("data-info-section");
            const matchedKey = explicitKey || detectInfoKey(infoTarget.textContent || "");
            if (matchedKey && INFO_SECTIONS[matchedKey]) {
              event.preventDefault();
              event.stopPropagation();
              openInfoSection(matchedKey);
              return;
            }
          }

          const trigger = event.target.closest(
            '[data-category], .category-card, .category-item, [class*="category"]'
          );
          if (!trigger) return;

          if (
            trigger.closest(
              "#catalog-grid, .catalog-grid, #products-grid, .products-grid, #shop-grid, .shop-grid"
            )
          ) {
            return;
          }

          const category =
            trigger.getAttribute("data-category") ||
            (trigger.dataset && trigger.dataset.category) ||
            (trigger.querySelector("[data-category]") &&
              trigger.querySelector("[data-category]").getAttribute("data-category")) ||
            (trigger.textContent ? trigger.textContent.trim().split("\n")[0].trim() : "");

          if (!category) return;

          [
            "applyCategoryFilter",
            "filterByCategory",
            "selectCategory",
            "filterProducts",
            "renderCatalog",
            "renderProducts"
          ].forEach((fnName) => {
            if (typeof window[fnName] === "function") {
              try {
                window[fnName](category);
              } catch (e) {}
            }
          });

          document.querySelectorAll("button, a, [role='button']").forEach((el) => {
            if (el === trigger) return;
            const label = el.textContent ? el.textContent.trim() : "";
            if (label && label.toLowerCase() === category.toLowerCase()) {
              try {
                el.click();
              } catch (e) {}
            }
          });

          const catalogTarget =
            document.querySelector("#catalog-section") ||
            document.querySelector("#catalog") ||
            document.querySelector("#catalog-grid") ||
            document.querySelector(".catalog-grid") ||
            document.querySelector("#products-grid") ||
            document.querySelector(".products-grid") ||
            document.querySelector("#shop-grid");

          if (catalogTarget) {
            event.preventDefault();
            catalogTarget.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        },
        true
      );

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", cleanStorefrontDom);
      } else {
        cleanStorefrontDom();
      }

      const observer = new MutationObserver(cleanStorefrontDom);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
